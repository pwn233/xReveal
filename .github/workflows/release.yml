# Release assets (docs/spec/v1.md §6). A release is made by hand: Actions › Release › Run workflow,
# naming a `v*` tag that's already pushed (e.g. v1.0.0) and confirming with release@<tag>
# (release@v1.0.0). The workflow builds that tag on both OSes and attaches the assets to a GitHub
# Release. Pushing a tag publishes nothing.
# Pull requests that touch packaging build the assets too, as artifacts only, so the pipeline is
# proven before a release needs it.
name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, already pushed (e.g. v1.0.0)"
        required: true
        type: string
      confirm:
        description: "Confirm: type release@<tag> (e.g. release@v1.0.0)"
        required: true
        type: string
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "packaging/**"
      - "scripts/package-*"

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  # A release in progress is never cut short; a pull request's build is replaced by a newer push.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # What to build: the chosen tag (checked) for a release, the pull request's commit otherwise.
  check:
    name: Check
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.version.outputs.sha }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Confirm the release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          CONFIRM: ${{ inputs.confirm }}
        shell: bash
        run: |
          tags() {
            local found
            found=$(gh api "repos/$GITHUB_REPOSITORY/tags" --paginate --jq '.[].name | select(startswith("v"))' || true)
            {
              echo "### Tags you can release"
              if [[ -n "$found" ]]; then
                sed 's/^/- /' <<< "$found"
              else
                echo "None yet. Push one: \`git tag v1.0.0 && git push origin v1.0.0\`"
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          }
          if [[ "$CONFIRM" != "release@$TAG" ]]; then
            echo "::error::To publish $TAG, type release@$TAG in the confirmation box (got '$CONFIRM')"
            exit 1
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$TAG' isn't a version tag like v0.1.0"
            tags
            exit 1
          fi
          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --silent 2>/dev/null; then
            echo "::error::There's no tag $TAG. Push it first: git tag $TAG && git push origin $TAG"
            tags
            exit 1
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::$TAG is already released"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.sha }}

      # The tag names the version; it must match Cargo.toml's at that tag, so the app reports what
      # it shipped as.
      - name: Version
        id: version
        env:
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "${TAG#v}" != "$version" ]]; then
            echo "::error::Tag $TAG doesn't match Cargo.toml's version $version at that tag"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-latest
          - name: Windows x64
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.sha }}

      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Ensure Metal toolchain
        if: runner.os == 'macOS'
        run: xcrun -f metal >/dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain

      # The stable self-signed certificate (#162), from the MACOS_SIGNING_P12 (base64) and
      # MACOS_SIGNING_PASSWORD secrets, in a keychain of its own that goes with the runner. Without
      # the secrets (a pull request, a fork) the build is signed ad hoc.
      - name: Signing certificate (macOS)
        if: runner.os == 'macOS' && github.event_name == 'workflow_dispatch'
        env:
          P12: ${{ secrets.MACOS_SIGNING_P12 }}
          PASSWORD: ${{ secrets.MACOS_SIGNING_PASSWORD }}
        run: |
          if [[ -z "$P12" ]]; then
            echo "::warning::No MACOS_SIGNING_P12 secret: this release is signed ad hoc, and macOS will ask for Camera and Microphone again after updating."
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "" "$keychain"
          security set-keychain-settings "$keychain"
          security unlock-keychain -p "" "$keychain"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -P "$PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/signing.p12"
          echo "XREVEAL_SIGN_IDENTITY=xReveal Self-Signed" >> "$GITHUB_ENV"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: scripts/package-macos.sh "${{ needs.check.outputs.version }}"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) {
            choco install nsis --no-progress -y
          }
          scripts/package-windows.ps1 -Version "${{ needs.check.outputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: xreveal-${{ runner.os }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*-setup.exe
          if-no-files-found: error

  release:
    name: Publish
    if: github.event_name == 'workflow_dispatch'
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      # The notes are that version's section of CHANGELOG.md at the tag (#144, #145): the same text
      # What's new shows after updating and Update available shows before.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          path: source
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            /^## / { on = ($2 == v) ; next }
            on && /^- / { print }
          ' source/CHANGELOG.md > notes.md
          if [[ ! -s notes.md ]]; then
            echo "::error::CHANGELOG.md has no '## $VERSION' section with '- ' lines at $TAG"
            exit 1
          fi
          # A tag with a suffix (v1.1.0-beta.1) is a prerelease: never "latest", never offered (#145).
          prerelease=()
          [[ "$TAG" == *-* ]] && prerelease=(--prerelease)
          # Checksums of every asset: xReveal's in-app update checks its download against them (#163).
          (cd assets && sha256sum -- * > SHA256SUMS)
          gh release create "$TAG" assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "xReveal $VERSION" \
            --notes-file notes.md \
            "${prerelease[@]}"
