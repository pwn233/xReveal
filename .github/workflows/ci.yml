# Build, lint and test on both OSes for every PR and every push to main (docs/spec/v1.md §5).
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
          - name: Windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins the version; this installs it (with clippy) up front.
      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      # GPUI compiles its Metal shaders at build time with `xcrun metal`.
      # Newer Xcode images ship the Metal toolchain as a separate download.
      - name: Ensure Metal toolchain
        if: runner.os == 'macOS'
        run: xcrun -f metal >/dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --all-targets --locked

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

      # No capture card on CI: the app must still open its window and present a frame through its
      # own video surface (Direct3D 11 on WARP). Exits 0 on the first present, 1 after 20 s.
      - name: Smoke launch (no card)
        if: runner.os == 'Windows'
        run: cargo run --locked
        env:
          XREVEAL_SMOKE_TEST: "1"
        timeout-minutes: 5

      - name: Upload Windows build
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: xreveal-windows-x64-debug
          path: target/debug/xreveal.exe
          if-no-files-found: error
