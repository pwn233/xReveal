[package]
name = "xreveal"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
cpal = "0.18"
# GPUI Kit: GPUI + gpui-component + default assets behind one dependency.
# https://gpui-kit.com
gpui-kit = "0.11.0"
raw-window-handle = "0.6"
rubato = "5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
sha2 = "0.10"
toml = "1.2.3"
zune-core = "0.5.3"
zune-jpeg = "0.5"

[features]
# PROTOTYPE (#196), never merged: the local control channel for unattended runs (src/drive.rs).
drive = []

[build-dependencies]
# The Windows exe's icon (#130), with the same embed-resource GPUI uses for its manifest.
embed-resource = "3.0"

[target.'cfg(target_os = "macos")'.dependencies]
# Capture (AVFoundation, CoreMediaIO) and the video surface (Metal under GPUI's view). docs/spec/v1.md §3.1, §3.4.
dispatch2 = "0.3"
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-av-foundation = { version = "0.3", features = ["block2", "dispatch2", "objc2-core-media", "objc2-core-video"] }
objc2-core-foundation = "0.3"
# The echo guard (#112): which audio devices are the Mac's own mic and speakers.
objc2-core-audio = "0.3"
objc2-core-media = { version = "0.3", features = ["objc2-core-video"] }
# Frames straight from the device's CoreMediaIO stream, without the camera effects an
# AVCaptureSession loads (#118).
objc2-core-media-io = { version = "0.3", default-features = false, features = ["std", "CMIOHardware", "CMIOHardwareDevice", "CMIOHardwareObject", "CMIOHardwareStream", "CMIOHardwareSystem", "objc2-core-foundation", "objc2-core-media"] }
objc2-core-video = { version = "0.3", features = ["objc2-metal", "objc2-io-surface"] }
objc2-foundation = "0.3"
objc2-metal = { version = "0.3", features = ["block2", "objc2-io-surface"] }
# The capture buffers' IOSurfaces, wrapped as Metal textures once per buffer (#118).
objc2-io-surface = "0.3"
# Metal's "presented" callback (the frame's on-screen time) is an Objective-C block.
block2 = "0.6"
objc2-quartz-core = { version = "0.3", features = ["objc2-metal", "objc2-core-foundation"] }

[target.'cfg(target_os = "windows")'.dependencies]
# Capture (Media Foundation) and the video surface (Direct3D 11 swap chain in a child window).
# docs/spec/v1.md §3.1, §3.4. Same major version as GPUI's own `windows` dependency.
windows = { version = "0.62", features = [
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Display",
    "Win32_Devices_Properties",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_DirectShow",
    "Win32_Media_MediaFoundation",
    # The Update available check (#145).
    "Win32_Networking_WinHttp",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_Performance",
    # Camera and Microphone access: the privacy settings' consent store (#176).
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }
# `#[implement]` (COM callbacks such as the Source Reader callback) refers to `windows_core` by name.
windows-core = "0.62"
