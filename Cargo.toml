[package]
name = "xreveal"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
cpal = "0.18"
# GPUI Kit: GPUI + gpui-component + default assets behind one dependency.
# https://gpui-kit.com
gpui-kit = "0.11.0"
raw-window-handle = "0.6"
rubato = "5"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.3"
zune-core = "0.5.3"
zune-jpeg = "0.5"

[target.'cfg(target_os = "macos")'.dependencies]
# Capture (AVFoundation) and the video surface (Metal under GPUI's view). docs/spec/v1.md §3.1, §3.4.
dispatch2 = "0.3"
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-av-foundation = { version = "0.3", features = ["block2", "dispatch2", "objc2-core-media", "objc2-core-video"] }
objc2-core-foundation = "0.3"
objc2-core-media = { version = "0.3", features = ["objc2-core-video"] }
objc2-core-video = { version = "0.3", features = ["objc2-metal"] }
objc2-foundation = "0.3"
objc2-metal = { version = "0.3", features = ["block2"] }
# Metal's "presented" callback (the frame's on-screen time) is an Objective-C block.
block2 = "0.6"
objc2-quartz-core = { version = "0.3", features = ["objc2-metal", "objc2-core-foundation"] }

[target.'cfg(target_os = "windows")'.dependencies]
# Capture (Media Foundation) and the video surface (Direct3D 11 swap chain in a child window).
# docs/spec/v1.md §3.1, §3.4. Same major version as GPUI's own `windows` dependency.
windows = { version = "0.62", features = [
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Display",
    "Win32_Devices_Properties",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Media_DirectShow",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_Performance",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# `#[implement]` (COM callbacks such as the Source Reader callback) refers to `windows_core` by name.
windows-core = "0.62"
